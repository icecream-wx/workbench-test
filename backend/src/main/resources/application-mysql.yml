# MySQL 8.x data source override. Combine with local/dev/prod:
#   --spring.profiles.active=local,mysql
#   --spring.profiles.active=dev,mysql
#   --spring.profiles.active=prod,mysql
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:workbench-test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
