# MySQL 8.x only. Nacos is a company-level service and is not started here.
# Usage: docker compose --profile mysql up -d
services:
  mysql:
    image: mysql:8.0
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-workbench-test}
    ports:
      - "${DB_PORT:-3306}:3306"
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql

  # redis:
  #   image: redis:7
  #   ports:
  #     - "6379:6379"

volumes:
  mysql-data:
